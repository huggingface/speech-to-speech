name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Project directory: . for the framework, or packages/<component>"
        type: string
        default: "."

permissions:
  contents: read

env:
  PACKAGE_PATH: ${{ inputs.package_path || '.' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: false
      - name: Validate project path
        run: |
          if [[ "$PACKAGE_PATH" != "." && ! "$PACKAGE_PATH" =~ ^packages/[a-z0-9-]+$ ]]; then
            echo "::error::Expected . or packages/<component>."
            exit 1
          fi
      - name: Build distributions
        run: uv build "$PACKAGE_PATH" --out-dir dist
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Verify declared dependencies before publishing
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" python -c "import importlib.metadata"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
