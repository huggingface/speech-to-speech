name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Keep tooling and browser integration jobs on the oldest supported interpreter.
env:
  UV_PYTHON: "3.11"

jobs:
  ruff:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/

  mypy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Mypy
        run: uv run mypy src/

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: NLTK data (punkt_tab for sent_tokenize)
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"
      - name: Pytest
        run: uv run pytest tests/ -x -q

  agents-sdk-websocket:
    permissions:
      contents: read
    name: Agents SDK / WebSocket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: uv sync --group dev
      - run: npm ci --prefix demo --no-audit --no-fund
      - run: npx --prefix demo playwright install --with-deps chromium
      - run: npm --prefix demo run test:agents:adapter
      - run: npm --prefix demo run test:agents:ws

  agents-sdk-webrtc:
    permissions:
      contents: read
    name: Agents SDK / WebRTC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: uv sync --group dev
      - run: npm ci --prefix demo --no-audit --no-fund
      - run: npx --prefix demo playwright install --with-deps chromium
      - run: npm --prefix demo run test:agents:webrtc

  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  # Optional OmniVoice compatibility checks live in omnivoice.yml.
  # Keep these checks focused on the default installation on every PR.
  install-smoke:
    permissions:
      contents: read
    name: Install smoke (${{ matrix.platform.label }}, Python ${{ matrix.python-version }})
    needs: package
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - label: linux
            os: ubuntu-latest
          - label: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install wheel with pip
        shell: bash
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          # Hash-verified bootstrap also works when ensurepip bundles an affected pip.
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          wheel=$(find dist -name 'speech_to_speech-*.whl' -print -quit)
          python -m pip install "${wheel}"
          python -m pip check
      - name: Run installed CLI smoke test
        shell: bash
        run: |
          source .venv-smoke/bin/activate
          unset OPENAI_API_KEY
          # Validate the installed entry point without loading models or calling OpenAI.
          python tests/install_smoke.py
      - name: Check optional Kokoro installation
        if: matrix.platform.label == 'macos-arm64' && matrix.python-version == '3.12'
        shell: bash
        run: |
          source .venv-smoke/bin/activate
          wheel=$(find dist -name 'speech_to_speech-*.whl' -print -quit)
          python -m pip install "${wheel}[kokoro]"
          python -m pip check
          python -c "from mlx_audio.tts.models.kokoro.pipeline import KokoroPipeline; from misaki import en, espeak"
