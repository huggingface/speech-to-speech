# Two independent engines, two GPUs. Keep inference ports on the private network.
# GPU 0: quantized Gemma on RTX Pro 6000 (96 GiB); GPU 1: Talker.
services:
  reasoner:
    image: vllm/vllm-openai@sha256:1ff6716fe240a922d0d518b8884261e25b0c02eda8e2ce90888e364978249cad
    gpus:
      - driver: nvidia
        device_ids: ['0']
        capabilities: [gpu]
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [hf-cache:/root/.cache/huggingface]
    command: [nvidia/Gemma-4-31B-IT-NVFP4, --revision, 4135a98a9b728a548947683219633b25682223ac, --quantization, modelopt, --enable-auto-tool-choice, --tool-call-parser, gemma4, --reasoning-parser, gemma4, --max-model-len, '8192', --max-num-seqs, '4', --gpu-memory-utilization, '0.90', --generation-config, vllm, --disable-log-requests]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8000/health]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
  talker:
    image: vllm/vllm-openai@sha256:1ff6716fe240a922d0d518b8884261e25b0c02eda8e2ce90888e364978249cad
    gpus:
      - driver: nvidia
        device_ids: ['1']
        capabilities: [gpu]
    ipc: host
    volumes: [hf-cache:/root/.cache/huggingface]
    command: [vysri/Qwen-0.6B-ConvFill, --revision, 9195fc16f0ba56743d956f0fab5eed2386665aff, --tokenizer, vysri/Qwen-0.6B-ConvFill, --tokenizer-revision, 9195fc16f0ba56743d956f0fab5eed2386665aff, --max-model-len, '4096', --max-num-seqs, '2', --gpu-memory-utilization, '0.35', --generation-config, vllm, --disable-log-requests]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:8000/health]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
  demo:
    build:
      context: ../../..
      dockerfile: examples/convfill/Dockerfile
    env_file: .env
    ports: ['127.0.0.1:7860:7860']
    depends_on:
      reasoner: {condition: service_healthy}
      talker: {condition: service_healthy}
volumes:
  hf-cache:
