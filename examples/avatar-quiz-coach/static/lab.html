<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viva · avatar lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="static/style.css">
  <style>
    body { overflow: auto; }
    #stage { inset: 0 300px 0 0; }
    #lab { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; padding: 14px; overflow: auto; background: var(--panel-solid); font-size: 13px; }
    #lab h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    #lab button { margin: 2px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
    #lab button.on { background: var(--accent); color: #000; }
    #stats { font: 12px ui-monospace, monospace; white-space: pre; color: var(--muted); }
    @media (max-width: 700px) { #stage { inset: 0 0 45vh 0; } #lab { top: 55vh; width: auto; left: 0; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "talkinghead": "./vendor/talkinghead/talkinghead.mjs",
      "headaudio": "./vendor/headaudio/headaudio.min.mjs",
      "gsplat": "./vendor/gsplat/gsplat-flame-avatar-renderer.esm.min.js",
      "jszip": "./static/js/jszip-shim.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"><div id="avatar"></div><div id="avatar-loading"><div class="ring"></div><span>Loading… <b id="avatar-pct">0%</b></span></div></div>
  <aside id="lab">
    <div id="coaches"></div>
    <h3>Speak</h3>
    <div id="speak"></div>
    <label><input type="checkbox" id="cues"> fake server cues (else HeadAudio)</label>
    <h3>React</h3>
    <div id="react"></div>
    <h3>Stats</h3>
    <div id="stats"></div>
  </aside>
  <script type="module" src="static/js/lab.js"></script>
</body>
</html>
